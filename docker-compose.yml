services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phonemegames
      POSTGRES_USER: phoneme_user
      POSTGRES_PASSWORD: phoneme_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoneme_user -d phonemegames"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://phoneme_user:phoneme_password@database:5432/phonemegames?schema=public
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    environment:
      API_URL_INTERNAL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: